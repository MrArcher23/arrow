[package]
name = "arrow-gui"
version = "0.1.9"
edition = "2021"
description = "arrow — audit viewer for Claude Code (native egui desktop app)"
license = "MIT"

[dependencies]
# The parser lives in the `arrow` crate (the repo root) and is reused as-is, with no
# duplicated logic: the GUI consumes its structs directly (no IPC, no JSON contract).
arrow = { path = ".." }
# "persistence" enables eframe's on-disk storage (replaces the web's localStorage) for
# the theme, zoom, and remembered editor; it also persists egui memory (sidebar width,
# tree expansion) for free.
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"
# Decode the bundled PNG into the window icon (png only — keep it light).
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse the transcripts' RFC3339 timestamps to compute relative times / the focus window
# (the parser stores them as ISO strings; the web did this with Date.parse in time.ts).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Native watcher for live refresh (same crate the Tauri backend used).
notify = "6"
# Walks a worktree's working tree to estimate its on-disk size (the "Calculate sizes"
# button of the worktree inventory). Same crate the parser uses.
walkdir = "2"
# Line-level diff for the side-by-side view (egui has no merge widget).
similar = "2"
# Syntax highlighting for the diff; two-face bundles bat's syntect themes/syntaxes.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = "0.4"

# Debian packaging (`cargo deb`). The package is named `arrow`; the binary installs as
# `arrow-gui` (so it never collides with the parser CLI `arrow`), plus a desktop entry and
# icon. AppImage/.dmg are produced in CI (see .github/workflows/release.yml).
[package.metadata.deb]
name = "arrow"
maintainer = "Diego Sanchez"
section = "devel"
priority = "optional"
depends = "$auto"
extended-description = "A native (egui) audit viewer for Claude Code: which files Claude touched, in which repo and session, with the diff — without an IDE, without AI chat, and without depending on git or hooks."
assets = [
    ["target/release/arrow-gui", "usr/bin/arrow-gui", "755"],
    ["assets/arrow.desktop", "usr/share/applications/arrow.desktop", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/arrow.png", "644"],
]

# Bundle metadata for `cargo bundle` (macOS .app / .dmg, built in CI on a Mac).
[package.metadata.bundle]
name = "arrow"
identifier = "dev.diegosanchez.arrow"
icon = ["assets/icon.png"]
category = "Developer Tool"
short_description = "An audit viewer for Claude Code."

# `arrow-gui` is its OWN workspace root (empty table below), exactly like `src-tauri`
# was: this keeps `cargo build` at the repo root compiling ONLY the parser/CLI (`arrow`)
# without pulling the heavy GUI dependency tree. Build the app from inside this crate
# (`cargo run` here) or with `--manifest-path gui/Cargo.toml`. The parser is
# reused via the path dependency `arrow = { path = ".." }`, with no duplicated logic.
[workspace]

# Release profile tuned for a small, distributable binary (.deb/AppImage/.dmg), mirroring
# the old Tauri backend: strip debug symbols, LTO + a single codegen unit for size, and
# abort-on-panic. opt-level "s" prioritizes size (arrow is IO-bound, not CPU-bound).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
