[package]
name = "arrow-app"
version = "0.2.1"
edition = "2021"
description = "arrow — visor de auditoría de Claude Code (app de escritorio Tauri)"
license = "MIT"
# El binario se llama distinto del crate `arrow` (la lib del parser) para no colisionar.
default-run = "arrow-app"

[lib]
name = "arrow_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# El parser vive en el crate `arrow` (la raíz del repo): se reutiliza tal cual,
# sin duplicar lógica. El backend de Tauri solo envuelve build_report/file_content.
arrow = { path = ".." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Watcher nativo para el refresco en vivo (sustituye/complementa el polling web).
notify = "6"
# Recorre el working tree de un worktree para estimar su tamaño en disco (botón
# "Calculate sizes" del inventario de worktrees). Mismo crate que usa el parser.
walkdir = "2"

[features]
# por defecto: ningún feature especial
default = []

# `src-tauri` es su PROPIA raíz de workspace: así `cargo build` desde la raíz del
# repo (lo que usan /verify-parser y el dev-server de Vite) compila SOLO el parser
# `arrow` y nunca arrastra el backend Tauri (que necesita libwebkit2gtk). El parser
# se reutiliza vía la dependencia path `arrow = { path = ".." }`, sin duplicar lógica.
[workspace]

# Build de release optimizado para tamaño (la app se distribuye como .deb/AppImage).
# `strip` quita los símbolos de debug (el grueso del binario sin optimizar); `lto` +
# `codegen-units=1` reducen tamaño y mejoran inlining a cambio de un build más lento;
# `opt-level="s"` prioriza tamaño (el cuello de botella del parser es IO, no CPU).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
