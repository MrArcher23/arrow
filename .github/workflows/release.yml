name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds the native (egui) desktop binary and packages it per platform, then publishes a
# GitHub Release with the artifacts attached (.deb + AppImage on Linux, .dmg on macOS).
#
# Unlike the old Tauri pipeline this needs NO WebKitGTK and NO Node/Vite — just Rust plus a
# couple of packaging tools. The build fans out over a platform matrix: one Linux runner and
# two macOS runners (Apple Silicon + Intel). action-gh-release is idempotent on the tag.
#
# Validate this workflow with a real tag push before relying on it for releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }}) and publish
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: pin to the OLDEST supported Ubuntu (glibc 2.35), NOT ubuntu-latest. glibc is
          # not forward-compatible, so building on 22.04 lets the .deb/AppImage run on
          # glibc >= 2.35 (Ubuntu/Pop!_OS 22.04, Debian 12, Fedora 37+, …).
          - os: ubuntu-22.04
          # The .dmg suffix must match what install.sh greps for (`_aarch64.dmg` / `_x64.dmg`).
          - os: macos-14 # Apple Silicon
            dmg_suffix: aarch64
          - os: macos-13 # Intel
            dmg_suffix: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux build deps for egui/eframe (no WebKitGTK needed anymore).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            file wget

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build the release binary
        run: cargo build --release

      # --- Linux: .deb (cargo-deb) + AppImage (linuxdeploy). ---
      - name: Package .deb
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build -o ../arrow-gui.deb

      - name: Package AppImage
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          cp assets/icon.png arrow.png
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e target/release/arrow-gui \
            -d assets/arrow.desktop \
            -i arrow.png \
            --output appimage
          mv arrow*.AppImage ../arrow_amd64.AppImage

      # --- macOS: .app + .dmg (cargo-bundle), ad-hoc signed (not notarized). ---
      - name: Package .app and .dmg
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release
          APP="target/release/bundle/osx/arrow.app"
          codesign --force --deep --sign - "$APP" || true
          hdiutil create -volname "arrow" -srcfolder "$APP" -ov -format UDZO \
            "../arrow_${{ matrix.dmg_suffix }}.dmg"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "arrow ${{ github.ref_name }}"
          body: "Native (egui) desktop builds for arrow ${{ github.ref_name }} — see the attached assets (.deb + AppImage on Linux, .dmg on macOS)."
          draft: false
          prerelease: false
          files: |
            arrow-gui.deb
            arrow_amd64.AppImage
            arrow_*.dmg
