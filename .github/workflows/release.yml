name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds the desktop bundles with `cargo tauri build` (exactly like locally) and publishes a
# GitHub Release with the artifacts (.deb + AppImage) attached.
#
# NOTE: this is conservative and Linux-only for now. macOS/Windows runners can be
# added later via a build matrix (see tauri-action docs); each needs its own runner
# and, on macOS, signing/notarization to ship outside the App Store.
# Validate this workflow with a real tag push before relying on it for releases.
on:
  push:
    tags:
      - "v*"

# The release needs write access to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build bundles and publish release
    # Pin to the OLDEST supported Ubuntu (glibc 2.35), NOT ubuntu-latest. glibc is
    # not forward-compatible: a binary linked against a newer glibc (ubuntu-latest
    # is 24.04 → glibc 2.39) fails at startup on older distros with
    # `version 'GLIBC_2.xx' not found`. Building on 22.04 lets the .deb/AppImage run
    # on glibc >= 2.35 (Ubuntu 22.04, Pop!_OS 22.04, Debian 12, …). 22.04 still ships
    # libwebkit2gtk-4.1-dev, which Tauri 2 needs. Do NOT bump this to ubuntu-latest.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # Build exactly like locally: `cargo tauri build` from the repo root. The Tauri CLI runs
      # beforeBuildCommand (npm run build) from web/ — the frontend dir it derives from
      # frontendDist (../web/dist) — so our web/ layout works. We do NOT use tauri-action
      # because it runs npm from the repo root, where there is no package.json (it lives in web/).
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the desktop bundles
        run: cargo tauri build

      - name: Publish the GitHub Release with the bundles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "arrow ${{ github.ref_name }}"
          body: "Desktop bundles (.deb + AppImage) for arrow ${{ github.ref_name }}. See the commit history for details."
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
