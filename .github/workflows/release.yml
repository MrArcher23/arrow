name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds the desktop bundles with tauri-action and publishes a GitHub Release
# with the artifacts (.deb + AppImage) attached.
#
# NOTE: this is conservative and Linux-only for now. macOS/Windows runners can be
# added later via a build matrix (see tauri-action docs); each needs its own runner
# and, on macOS, signing/notarization to ship outside the App Store.
# Validate this workflow with a real tag push before relying on it for releases.
on:
  push:
    tags:
      - "v*"

# The release needs write access to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build bundles and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # tauri-action runs beforeBuildCommand (npm run build) from the frontend dir,
      # builds the bundles, and creates/uploads the GitHub Release in one step.
      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # src-tauri/ is a separate workspace; point tauri-action at its config.
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "arrow ${{ github.ref_name }}"
          releaseBody: "Desktop bundles (.deb + AppImage) for arrow ${{ github.ref_name }}. See the commit history for details."
          releaseDraft: false
          prerelease: false
