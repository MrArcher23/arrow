name: CI

# Runs on every push to main and on every pull request.
# The repo is split into two independently checkable Rust crates:
#   - the root crate `arrow` (pure-Rust parser/CLI, no system deps),
#   - `gui/` (the native egui desktop app — its OWN cargo workspace).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow running the CI manually from the Actions tab

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Root crate: format, lint and test the pure-Rust parser/CLI. ---
  # No system dependencies: `cargo build` at the repo root pulls ONLY `arrow`
  # (serde, serde_json, walkdir, anyhow, clap) and never the GUI dependency tree.
  rust:
    name: rust (parser/CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --release

  # --- GUI crate: format, lint, test and compile-check the egui desktop app. ---
  # gui/ is a SEPARATE cargo workspace, so we run cargo inside it. egui/eframe
  # need a few X11/Wayland/keyboard dev libs to build on Linux.
  gui:
    name: gui (egui app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (egui/eframe)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # gui is its own workspace; cache it independently of the root crate.
          workspaces: gui

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: gui

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: gui

      - name: Run tests
        run: cargo test --release
        working-directory: gui
